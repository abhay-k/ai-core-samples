apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: abhay-reorder-pipeline
  labels:
    scenarios.ai.sap.com/id: "abhay-reorder-learning"
    ai.sap.com/version: "0.0.1"
  annotations:
    scenarios.ai.sap.com/name: "abhay-reorder-learning"
    scenarios.ai.sap.com/description: "Abhay's Predictive Reorder Level Scenario"
    executables.ai.sap.com/name: "abhay-reorder-pipeline"
    executables.ai.sap.com/description: "Predict reorder levels from HANA sales history"
spec:
  entrypoint: mytemplate
  templates:
    - name: mytemplate
      container:
        image: "docker.io/n8nforabhay/aicore-reorder-demo:v2"
        command: ["python", "predict_reorder.py"]
        volumeMounts:
          - name: hana-secret-vol
            mountPath: /mnt/secrets/hana
      volumes:
        - name: hana-secret-vol
          secret:
            secretName: hana-connection-secret
